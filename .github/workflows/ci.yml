name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests experiments examples
      - run: pytest -q
  integration-codeverify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SreenijaPavuluri/code-verify-agents
          path: code-verify-agents
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]" -e ./code-verify-agents
      - run: pytest -q tests/test_codeverify_integration.py
        env:
          CODEVERIFY_DATASET: ${{ github.workspace }}/code-verify-agents/benchmarks/dataset
